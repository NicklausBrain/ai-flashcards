name: Unit Test Coverage - my-1k-ee

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  coverage:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      COVERAGE_THRESHOLD: 12.5
    steps:
      - uses: actions/checkout@v4

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Restore
        run: dotnet restore My1kWordsEe.Tests.Unit/My1kWordsEe.Tests.Unit.csproj

      - name: Build unit tests
        run: dotnet build My1kWordsEe.Tests.Unit/My1kWordsEe.Tests.Unit.csproj --configuration Release --no-restore

      - name: Run unit tests with coverage
        run: dotnet test My1kWordsEe.Tests.Unit/My1kWordsEe.Tests.Unit.csproj --configuration Release --no-build --collect:"XPlat Code Coverage" --settings CodeCoverage.runsettings

      - name: Install ReportGenerator
        run: dotnet tool install dotnet-reportgenerator-globaltool --tool-path ./.tools

      - name: Generate coverage reports
        run: ./.tools/reportgenerator -reports:"My1kWordsEe.Tests.Unit/TestResults/**/coverage.cobertura.xml" -targetdir:"My1kWordsEe.Tests.Unit/TestResults/CoverageReport" -reporttypes:"HtmlInline;MarkdownSummaryGithub;Cobertura"

      - name: Publish coverage summary
        run: cat My1kWordsEe.Tests.Unit/TestResults/CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: My1kWordsEe.Tests.Unit/TestResults/CoverageReport
          if-no-files-found: error
          retention-days: 14

      - name: Prepare PR coverage comment
        if: github.event_name == 'pull_request'
        run: |
          echo "## My1kWordsEe Unit Test Coverage Report" > coverage-comment.md
          echo "" >> coverage-comment.md
          echo "**Project:** \`My1kWordsEe.Tests.Unit\`  " >> coverage-comment.md
          echo "**Workflow:** \`${{ github.workflow }}\`  " >> coverage-comment.md
          echo "**Commit:** \`${{ github.sha }}\`  " >> coverage-comment.md
          echo "**Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> coverage-comment.md
          echo "" >> coverage-comment.md
          cat My1kWordsEe.Tests.Unit/TestResults/CoverageReport/SummaryGithub.md >> coverage-comment.md
          echo "" >> coverage-comment.md
          echo "> Full HTML report is available in the **unit-test-coverage** artifact for this workflow run." >> coverage-comment.md

      - name: Post sticky PR coverage comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: unit-test-coverage
          path: coverage-comment.md

      - name: Enforce minimum line coverage
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          tree = ET.parse('My1kWordsEe.Tests.Unit/TestResults/CoverageReport/Cobertura.xml')
          root = tree.getroot()
          line_rate = float(root.attrib.get('line-rate', 0.0)) * 100
          threshold = float(os.environ.get('COVERAGE_THRESHOLD', '0'))
          print(f"Line coverage: {line_rate:.2f}% (threshold: {threshold:.2f}%)")
          if line_rate < threshold:
              raise SystemExit(f"Coverage gate failed: line coverage {line_rate:.2f}% is below threshold {threshold:.2f}%.")
          PY
